appId: io.linksunder.desktop
productName: LinkSunder
asar: true
beforePack: desktop/before-pack.cjs
directories:
  output: release
files:
  - dist/**/*
  - desktop/**/*
  - package.json
  - '!node_modules/vite/**'
extraResources:
  - from: build/browsers
    to: browsers
  - from: docs/Inter-OFL.txt
    to: licenses/Inter-OFL.txt
win:
  icon: desktop/icon.ico
  target:
    - nsis
    - zip
  artifactName: LinkSunder-${version}-Windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
linux:
  icon: desktop/icon.png
  executableName: linksunder
  target:
    - deb
    - AppImage
  category: Development
  maintainer: LinkSunder contributors
  artifactName: LinkSunder-${version}-Linux-${arch}.${ext}
publish:
  - provider: github
    owner: kavianpcx
    repo: linksunder
    releaseType: release
