name: Desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npx playwright install-deps chromium
        if: runner.os == 'Linux'
      - run: npm run desktop:browser
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:desktop
        if: runner.os == 'Windows'
        env:
          PLAYWRIGHT_BROWSERS_PATH: build/browsers
      - run: xvfb-run --auto-servernum npm run test:desktop
        if: runner.os == 'Linux'
        env:
          PLAYWRIGHT_BROWSERS_PATH: build/browsers
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:desktop
        if: runner.os == 'Windows'
        env:
          LINKSUNDER_PACKAGED_EXE: release/win-unpacked/LinkSunder.exe
      - run: xvfb-run --auto-servernum npm run test:desktop
        if: runner.os == 'Linux'
        env:
          LINKSUNDER_PACKAGED_EXE: release/linux-unpacked/linksunder
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LinkSunder-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.deb
            release/*.AppImage
          if-no-files-found: error
