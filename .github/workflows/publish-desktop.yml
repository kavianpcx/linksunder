name: Publish tested desktop packages
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Desktop packages run ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - name: Verify tested build and obtain its commit
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > build.json
          jq -e '.name == "Desktop packages" and .status == "completed" and .conclusion == "success" and .head_branch == "main" and .event == "workflow_dispatch"' build.json
          echo "BUILD_SHA=$(jq -r .head_sha build.json)" >> "$GITHUB_ENV"
      - name: Download verified packages
        run: gh run download "$BUILD_RUN" --dir packages
      - name: Fetch release notes from the tested commit
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/contents/docs/release-v0.3.0.md?ref=$BUILD_SHA" --jq .content | base64 --decode > notes.md
          gh api "repos/$GH_REPO/contents/package.json?ref=$BUILD_SHA" --jq .content | base64 --decode > package.json
          VERSION=$(jq -r .version package.json)
          [[ "$VERSION" == "0.3.0" ]]
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Verify release is new and validate all package assets
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to move it."
            exit 1
          fi
          mapfile -d '' assets < <(find packages -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          [[ "${#assets[@]}" -eq 4 ]]
          expected=(
            "LinkSunder-$VERSION-Windows-x64.exe"
            "LinkSunder-$VERSION-Windows-x64.zip"
            "LinkSunder-$VERSION-Linux-amd64.deb"
            "LinkSunder-$VERSION-Linux-x86_64.AppImage"
          )
          for name in "${expected[@]}"; do
            count=$(find packages -type f -name "$name" | wc -l)
            [[ "$count" -eq 1 ]] || { echo "Expected exactly one $name, found $count."; exit 1; }
          done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
      - name: Publish desktop release with all four downloads
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find packages -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          gh release create "$TAG" --target "$BUILD_SHA" --title "LinkSunder $TAG — desktop applications" --notes-file notes.md "${assets[@]}" SHA256SUMS.txt
