name: Feature request
description: Suggest a focused improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What user problem would this solve?
      description: Describe who is affected and when the problem occurs.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What behavior would you like?
      description: Describe a simple outcome. Implementation details are optional.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: How would this help users?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
  - type: markdown
    attributes:
      value: >-
        Please do not post credentials, private reports, or exploitable security
        details here. Use the private reporting instructions in [SECURITY.md](https://github.com/kavianpcx/linksunder/blob/main/SECURITY.md)
        for security concerns.
